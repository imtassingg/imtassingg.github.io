<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SharpINT Official Website</title>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono&display=swap" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #11121a, #0a0b10);
      color: #c8c8c8;
      font-family: 'Ubuntu Mono', monospace;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    nav.navbar {
      width: 100%;
      background: #11121a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 40px;
      box-shadow: 0 0 10px #bd34feaa;
      box-sizing: border-box;
    }

    .navbar-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .navbar-logo img {
      width: 40px;
      border-radius: 8px;
      box-shadow: 0 0 10px #bd34fe;
    }

    .navbar-title,
    .navbar-link {
      color: #bd34fe;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }

    .navbar-title:hover,
    .navbar-link:hover {
      color: #ff77ff;
      text-decoration: underline;
    }

    .navbar-categories a {
      margin-left: 15px;
      font-size: 0.9rem;
    }

    .navbar-right button {
      background: transparent;
      border: none;
      font-size: 1.2rem;
      color: #bd34fe;
      cursor: pointer;
      margin-left: 10px;
      transition: color 0.3s;
    }

    .navbar-right button:hover {
      color: #ff77ff;
    }

    .container {
      display: flex;
      gap: 40px;
      background: #11121acc;
      box-shadow: 0 0 30px #bd34fe99;
      border: 1px solid #3b1e64;
      padding: 30px;
      border-radius: 12px;
      max-width: 900px;
      width: 90%;
      margin: 40px 0;
      box-sizing: border-box;
      color: #ddd;
    }

    .image-section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .image-section img {
      max-width: 100%;
      border: 3px solid #bd34fe;
      border-radius: 12px;
      box-shadow: 0 0 20px #bd34feaa;
    }

    .text-section {
      flex: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 15px;
    }

    .text-section h1 {
      color: #bd34fe;
      font-size: 2rem;
      margin: 0 0 10px 0;
    }

    .text-section h2 {
      color: #efbbff;
      font-weight: normal;
      margin: 0;
    }

    .text-section b {
      color: #e4b0ff;
      font-size: 1.1rem;
    }

    .text-section p {
      font-size: 1rem;
      color: #c8c8c8;
    }

    footer {
      text-align: center;
      color: #bd34fe;
      padding: 20px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-left">
      <div class="navbar-logo">
        <img src="https://avatars.githubusercontent.com/u/161966183?s=400&u=31eace7386cd10628e198e2e87dcbfdcc3800155&v=4" alt="Logo" />
      </div>
      <a href="https://imtassingg.github.io" class="navbar-title">Home</a>
      <div class="navbar-categories">
        <a href="https://imtassingg.github.io/docs" class="navbar-link">Docs</a>
        <a href="https://imtassingg.github.io/info" class="navbar-link">Info</a>
        <a href="https://imtassingg.github.io/sm" class="navbar-link">Social Media</a>
        <a href="https://imtassingg.github.io/drshitpost" class="navbar-link">DR Shitpost</a>
      </div>
    </div>
    <div class="navbar-right">
      <button class="navbar-icon" title="Search">🔍</button>
      <button class="navbar-icon" title="Add">➕</button>
    </div>
  </nav>

  <div class="container">
    <div class="image-section">
      <img src="https://avatars.githubusercontent.com/u/161966183?s=400&u=31eace7386cd10628e198e2e87dcbfdcc3800155&v=4" alt="SharpINT Logo" />
    </div>
    <div class="text-section">
      <h1>ImTassingg Custom Website</h1>
      <h2>Hi, this is my website, do you like it?</h2>
      <b>Well, if you like it, remember to visit the other sections!</b>
      <p>Goodbye and have fun reading my website!</p>
    </div>
  </div>

  <footer>© 2025 SharpINT Team</footer>
</body>
</html>
